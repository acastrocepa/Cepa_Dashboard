<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEPA Clientes Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
--bg:#08111f;
--sur:#101c2f;
--sur2:#17263d;
--bor:#22344f;
--bor2:#355277;
--tx:#dbe7ff;
--tx2:#9db2d1;
--tx3:#5f7699;
--wh:#fff;
--blu:#1a6cf5;
--acc:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--tx)}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--sur);border-bottom:1px solid var(--bor)}
.logo{width:40px;height:40px;background:var(--blu);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 72px)}
.sb{background:var(--sur);padding:18px;border-right:1px solid var(--bor);overflow:auto}
.main{padding:18px;overflow:auto}
.sb-sec{margin-bottom:18px}
.sb-ttl{font-size:12px;color:var(--tx3);margin-bottom:8px;text-transform:uppercase}
.sb-sel,.einp{width:100%;padding:10px;background:var(--sur2);border:1px solid var(--bor2);border-radius:8px;color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:20px;background:var(--sur2);cursor:pointer;font-size:11px}
.chip.on{background:var(--blu);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--sur);padding:16px;border-radius:12px;border:1px solid var(--bor)}
.kpi-v{font-size:28px;font-weight:bold;margin:6px 0}
.row2,.row3{display:grid;gap:16px;margin-bottom:16px}
.row2{grid-template-columns:1fr 1fr}
.row3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--sur);padding:16px;border-radius:12px;border:1px solid var(--bor)}
.card-ttl{font-size:16px;font-weight:bold}
.card-sub{font-size:11px;color:var(--tx3)}
.ch200{height:200px}
.ch480{height:480px}
.tbl-w{overflow:auto;max-height:400px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--bor);font-size:12px}
th{background:var(--sur2);position:sticky;top:0}
tr:hover{background:rgba(255,255,255,.03)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--sur);padding:20px;border-radius:14px;width:500px;max-width:95vw;max-height:90vh;overflow:auto}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;background:var(--blu);color:#fff}
.mfooter{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media(max-width:1100px){
.row2,.row3,.kpis{grid-template-columns:1fr}
.wrap{grid-template-columns:1fr}
.sb{display:none}
}
</style>
</head>
<body>
<header class="hdr">
<div style="display:flex;gap:12px;align-items:center">
<div class="logo">C</div>
<div>
<h2>CEPA Clientes</h2>
<div style="font-size:12px;color:var(--tx3)">Dashboard Gerencial</div>
</div>
</div>
<div style="display:flex;gap:10px;align-items:center">
<input id="si" class="einp" style="width:240px" placeholder="Buscar colegio...">
<button class="btn" id="btnAdd">+ Agregar Colegio</button>
</div>
</header>
<div class="wrap">
<aside class="sb">
<div class="sb-sec">
<div class="sb-ttl">Región</div>
<select class="sb-sel" id="fReg"><option value="">Todas</option></select>
</div>
<div class="sb-sec">
<div class="sb-ttl">Dependencia</div>
<div class="chips" id="cDeps"></div>
</div>
</aside>
<main class="main">
<div class="kpis">
<div class="kpi"><div>Total colegios</div><div class="kpi-v" id="kT">0</div></div>
<div class="kpi"><div>Matrícula total</div><div class="kpi-v" id="kM">0</div></div>
<div class="kpi"><div>Promedio</div><div class="kpi-v" id="kP">0</div></div>
<div class="kpi"><div>Con PIE</div><div class="kpi-v" id="kPi">0%</div></div>
<div class="kpi"><div>Subvencionados</div><div class="kpi-v" id="kS">0</div></div>
</div>
<div class="row3">
<div class="card">
<div class="card-ttl">Matrícula por Región</div>
<div class="ch200"><canvas id="cReg"></canvas></div>
</div>
<div class="card">
<div class="card-ttl">Dependencia</div>
<div class="ch200"><canvas id="cDep"></canvas></div>
</div>
<div class="card">
<div class="card-ttl">Penetración de Mercado</div>
<div class="ch200"><canvas id="cMkt"></canvas></div>
</div>
</div>
<div class="row2">
<div class="card">
<div class="card-ttl">Top 25 Matrícula</div>
<div class="ch480"><canvas id="cT25"></canvas></div>
</div>
<div class="card">
<div class="card-ttl">Top Subvencionados</div>
<div class="ch480"><canvas id="cSub"></canvas></div>
</div>
</div>
<div class="card">
<div class="card-ttl">Ranking completo</div>
<div class="tbl-w"><table id="tbl"></table></div>
</div>
</main>
</div>

<div class="ov" id="ovNew">
<div class="modal">
<h2>Agregar Colegio</h2>
<div style="display:grid;gap:10px;margin-top:16px">
<input class="einp" id="nRbd" placeholder="RBD">
<input class="einp" id="nNom" placeholder="Nombre">
<input class="einp" id="nReg" placeholder="Región">
<input class="einp" id="nCom" placeholder="Comuna">
<input class="einp" id="nDep" placeholder="Dependencia">
<input class="einp" id="nMat" type="number" placeholder="Matrícula">
</div>
<div class="mfooter">
<button class="btn" onclick="closeNew()">Cancelar</button>
<button class="btn" onclick="saveNew()">Guardar</button>
</div>
</div>
</div>

<script>
const RAW=[
{rbd:'1001',nombre:'Colegio San Pedro',region:'RM',comuna:'Santiago',dependencia:'PART SUBV',pie:'SI TIENE PIE',matricula:850},
{rbd:'1002',nombre:'Liceo Norte',region:'VALPO',comuna:'Valparaiso',dependencia:'MUNICIPAL',pie:'NO TIENE PIE',matricula:620},
{rbd:'1003',nombre:'Colegio Austral',region:'BBIO',comuna:'Concepcion',dependencia:'SLEP',pie:'SI TIENE PIE',matricula:710}
];

const DC={
'PART SUBV':'#38bdf8',
'MUNICIPAL':'#1a6cf5',
'SLEP':'#0ea5e9',
'PART PAGADO':'#ef4444'
};

function KPI(data){
const t=data.length;
const m=data.reduce((a,b)=>a+b.matricula,0);
const pie=data.filter(r=>r.pie==='SI TIENE PIE').length;
const sub=data.filter(r=>['PART SUBV','MUNICIPAL','SLEP'].includes(r.dependencia)).length;
document.getElementById('kT').textContent=t;
document.getElementById('kM').textContent=m.toLocaleString('es-CL');
document.getElementById('kP').textContent=t?Math.round(m/t):0;
document.getElementById('kPi').textContent=t?Math.round(pie/t*100)+'%':'0%';
document.getElementById('kS').textContent=sub;
}

function renderTable(data){
const tbl=document.getElementById('tbl');
tbl.innerHTML=`<thead><tr><th>RBD</th><th>Colegio</th><th>Region</th><th>Comuna</th><th>Dependencia</th><th>Matricula</th></tr></thead>`;
const tb=document.createElement('tbody');
data.forEach(r=>{
const tr=document.createElement('tr');
tr.innerHTML=`<td>${r.rbd}</td><td>${r.nombre}</td><td>${r.region}</td><td>${r.comuna}</td><td>${r.dependencia}</td><td>${r.matricula}</td>`;
tb.appendChild(tr);
});
tbl.appendChild(tb);
}

function charts(data){
new Chart(document.getElementById('cReg'),{
type:'doughnut',
data:{labels:data.map(r=>r.region),datasets:[{data:data.map(r=>r.matricula),backgroundColor:['#1a6cf5','#38bdf8','#0ea5e9']}]}
});

new Chart(document.getElementById('cDep'),{
type:'pie',
data:{labels:data.map(r=>r.dependencia),datasets:[{data:data.map(r=>r.matricula),backgroundColor:data.map(r=>DC[r.dependencia]||'#999')}]}
});

new Chart(document.getElementById('cMkt'),{
type:'doughnut',
data:{labels:['CEPA','Resto'],datasets:[{data:[data.length,9617-data.length],backgroundColor:['#1a6cf5','#1f2937']}]}
});

new Chart(document.getElementById('cT25'),{
type:'bar',
data:{labels:data.map(r=>r.nombre),datasets:[{data:data.map(r=>r.matricula)}]},
options:{indexAxis:'y'}
});

new Chart(document.getElementById('cSub'),{
type:'bar',
data:{labels:data.map(r=>r.nombre),datasets:[{data:data.map(r=>r.matricula)}]},
options:{indexAxis:'y'}
});
}

function initFilters(){
const reg=document.getElementById('fReg');
[...new Set(RAW.map(r=>r.region))].forEach(r=>{
const o=document.createElement('option');
o.value=r;o.textContent=r;reg.appendChild(o);
});

const deps=document.getElementById('cDeps');
['Todos',...new Set(RAW.map(r=>r.dependencia))].forEach(d=>{
const c=document.createElement('span');
c.className='chip'+(d==='Todos'?' on':'');
c.textContent=d;
deps.appendChild(c);
});
}

function openNew(){document.getElementById('ovNew').classList.add('open')}
function closeNew(){document.getElementById('ovNew').classList.remove('open')}

function saveNew(){
const nuevo={
rbd:document.getElementById('nRbd').value,
nombre:document.getElementById('nNom').value,
region:document.getElementById('nReg').value,
comuna:document.getElementById('nCom').value,
dependencia:document.getElementById('nDep').value,
pie:'SI TIENE PIE',
matricula:parseInt(document.getElementById('nMat').value)||0
};
RAW.push(nuevo);
closeNew();
renderAll();
}

function renderAll(){
KPI(RAW);
renderTable(RAW);
}

document.getElementById('btnAdd').addEventListener('click',openNew);
renderAll();
initFilters();
charts(RAW);
</script>
</body>
</html>
